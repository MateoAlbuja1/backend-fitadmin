services:
  caddy:
    image: caddy:2-alpine
    container_name: fitadmin-caddy
    restart: unless-stopped
    environment:
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:?Define FRONTEND_DOMAIN in .env}
      API_DOMAIN: ${API_DOMAIN:?Define API_DOMAIN in .env}
      DB_DOMAIN: ${DB_DOMAIN:?Define DB_DOMAIN in .env}
      MONGO_EXPRESS_DOMAIN: ${MONGO_EXPRESS_DOMAIN:?Define MONGO_EXPRESS_DOMAIN in .env}
      DB_BASIC_AUTH_HASH: ${DB_BASIC_AUTH_HASH:?Define DB_BASIC_AUTH_HASH in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - api-gateway
      - adminer
      - mongo-express

  frontend:
    build:
      context: ../fit-admin
      dockerfile: Dockerfile
    container_name: fitadmin-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      FITADMIN_API_URL: ${FITADMIN_API_URL:?Define FITADMIN_API_URL in .env}
    expose:
      - "4000"

  postgres:
    image: postgres:16-alpine
    container_name: fitadmin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fitadmin}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitadmin} -d ${POSTGRES_DB:-fitadmin}"]
      interval: 10s
      timeout: 5s
      retries: 8

  adminer:
    image: adminer:4
    container_name: fitadmin-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  mongo:
    image: mongo:7
    container_name: fitadmin-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-fitadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Define MONGO_INITDB_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-fitadmin_mongo}
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
      - ./database/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 8

  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: fitadmin-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo_viewer:${MONGO_VIEWER_PASSWORD:?Define MONGO_VIEWER_PASSWORD in .env}@mongo:27017/${MONGO_DATABASE:-fitadmin_mongo}?authSource=${MONGO_DATABASE:-fitadmin_mongo}
      ME_CONFIG_BASICAUTH: "false"
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "false"
      ME_CONFIG_OPTIONS_READONLY: "true"
      ME_CONFIG_OPTIONS_NO_DELETE: "true"
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "8081"

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: fitadmin-auth-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Define ADMIN_EMAIL in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?Define CORS_ORIGIN in .env}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3001"

  gym-service:
    build:
      context: .
      dockerfile: services/gym-service/Dockerfile
    container_name: fitadmin-gym-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?Define CORS_ORIGIN in .env}
      BACKUP_DIR: /app/backups
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups:/app/backups
    expose:
      - "3002"

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    container_name: fitadmin-inventory-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?Define CORS_ORIGIN in .env}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_CURRENCY: ${PAYPAL_CURRENCY:-USD}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3003"

  report-service:
    build:
      context: .
      dockerfile: services/report-service/Dockerfile
    container_name: fitadmin-report-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3004
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL in .env}
      MONGO_URL: ${MONGO_URL:?Define MONGO_URL in .env}
      MONGO_DATABASE: ${MONGO_DATABASE:-fitadmin_mongo}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?Define CORS_ORIGIN in .env}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    expose:
      - "3004"

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: fitadmin-api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      GYM_SERVICE_URL: http://gym-service:3002
      INVENTORY_SERVICE_URL: http://inventory-service:3003
      REPORT_SERVICE_URL: http://report-service:3004
      CORS_ORIGIN: ${CORS_ORIGIN:?Define CORS_ORIGIN in .env}
    depends_on:
      - auth-service
      - gym-service
      - inventory-service
      - report-service
    expose:
      - "3000"

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  mongo_data:
